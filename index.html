<!DOCTYPE html>
<html>
<head>
    <title>Career Guidance Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>CAREER GUIDANCE FORM</h1>

    <form id="form">

        <label>Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label>Class</label>
        <input type="text" id="class" placeholder="Enter your class">

        <label>Stream</label>
        <input type="text" id="stream" placeholder="Science / Arts / Commerce">

        <label>Interest</label>
        <input type="text" id="interest" placeholder="Your interest">

        <button type="submit">SUBMIT</button>

    </form>

    <p id="result"></p>
</div>

<script src="script.js"></script>

</body>
</html>
